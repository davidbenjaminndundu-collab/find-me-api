name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-tests:
    name: Laravel quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: find_me_test
          POSTGRES_USER: find_me_user
          POSTGRES_PASSWORD: find_me_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U find_me_user -d find_me_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_pgsql, redis, bcmath, intl, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: find_me_test
          DB_USERNAME: find_me_user
          DB_PASSWORD: find_me_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: database
          QUEUE_CONNECTION: database
          SESSION_DRIVER: file

      - name: Run migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: find_me_test
          DB_USERNAME: find_me_user
          DB_PASSWORD: find_me_password

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

      - name: Run PHPStan / Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run JavaScript lint
        run: npm run lint

      - name: Run tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: find_me_test
          DB_USERNAME: find_me_user
          DB_PASSWORD: find_me_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379